name: Event Sync

on:
  workflow_dispatch:
    inputs:
      chain_id:
        description: Chain ID selected by the Worker
        required: true
        type: string
      request_id:
        description: Unique Worker dispatch ID, echoed by the callback
        required: true
        type: string
      tx_hash:
        description: Optional transaction that prompted this sync
        required: false
        type: string

concurrency:
  group: event-sync-${{ inputs.chain_id }}
  cancel-in-progress: false

jobs:
  sync-events:
    name: Sync Blockchain Events
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run event sync script
        id: sync
        env:
          # Supabase configuration (read from GitHub Secrets)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          
          # Event sync configuration
          EVENT_SYNC_USE_PROXY: 'false'
          EVENT_SYNC_SAVE_JSON: 'false'
          
          # Optional: Custom sync configuration
          EVENT_SYNC_FROM_BLOCK: ${{ secrets.EVENT_SYNC_FROM_BLOCK }}
          EVENT_SYNC_LIMIT: ${{ secrets.EVENT_SYNC_LIMIT }}
          EVENT_SYNC_BATCH_SIZE: ${{ secrets.EVENT_SYNC_BATCH_SIZE }}
        run: npm start
        continue-on-error: true

      - name: Notify Worker
        if: ${{ always() }}
        env:
          SYNC_STATUS: ${{ steps.sync.outcome == 'success' && 'success' || 'failed' }}
        run: |
          curl --fail --retry 3 --retry-all-errors -X POST "${{ secrets.SYNC_WORKER_URL }}/sync-callback" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SYNC_CLIENT_SECRET }}" \
            -d '{"chainId": "${{ inputs.chain_id }}", "requestId": "${{ inputs.request_id }}", "status": "'"$SYNC_STATUS"'"}'

      - name: Mark workflow failed when synchronization failed
        if: ${{ always() }}
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        run: |
          test "$SYNC_OUTCOME" = "success"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs
          path: '*.log'
          if-no-files-found: ignore
